<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium drop shadow for the main document base -->
    <filter id="doc-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0ea5e9" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#020617" flood-opacity="0.06"/>
    </filter>
    
    <!-- Shadow for the checkmark badge to layer it over the document -->
    <filter id="badge-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.14"/>
    </filter>

    <!-- Gradient for the document page background to add depth -->
    <linearGradient id="page-grad" x1="256" y1="32" x2="256" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Gradient for the folded corner to make it look 3D -->
    <linearGradient id="fold-grad" x1="360" y1="32" x2="424" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <!-- Gradient for the checkmark badge -->
    <linearGradient id="badge-grad" x1="390" y1="320" x2="390" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Document Base with shadow, paper gradient, and 22px stroke border -->
  <path d="M120 64C120 46.3269 134.327 32 152 32H360L424 96V448C424 465.673 409.673 480 392 480H152C134.327 480 120 465.673 120 448V64Z" fill="url(#page-grad)" stroke="#0ea5e9" stroke-width="22" stroke-linejoin="round" filter="url(#doc-shadow)"/>
  
  <!-- Subtle shadow under the fold to add 3D depth crease -->
  <path d="M360 96L410 96L360 146V96Z" fill="#020617" fill-opacity="0.06"/>

  <!-- Folded Corner with gradient -->
  <path d="M360 32V96H424L360 32Z" fill="url(#fold-grad)" stroke="#0ea5e9" stroke-width="22" stroke-linejoin="round"/>
  
  <!-- Refined "M" Shape (Lighter stroke weight of 34px for elegant look) -->
  <path d="M198 260V156L256 220L314 156V260" stroke="#1c1917" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- INVOICES Text using IBM Plex Sans -->
  <text x="256" y="328" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#1c1917" text-anchor="middle" letter-spacing="5">INVOICES</text>
  
  <!-- Document Lines -->
  <path d="M176 382H266" stroke="#BAE6FD" stroke-width="20" stroke-linecap="round"/>
  <path d="M176 424H236" stroke="#BAE6FD" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Checkmark Badge with metallic gradient outline and shadow -->
  <circle cx="390" cy="390" r="70" fill="url(#badge-grad)" stroke="#FFFFFF" stroke-width="20" filter="url(#badge-shadow)"/>
  <!-- Checkmark -->
  <path d="M355 395L375 415L425 365" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
