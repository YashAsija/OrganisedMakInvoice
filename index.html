<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Invoice & Bill Maker</title>
    <script>
      // Wrap fetch safely before any ES modules execute
      try {
        const originalFetch = window.fetch;
        if (originalFetch) {
          let currentFetch = originalFetch.bind(window);
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch;
            },
            set(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {
        console.warn('Unable to safely polyfill window.fetch:', e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
