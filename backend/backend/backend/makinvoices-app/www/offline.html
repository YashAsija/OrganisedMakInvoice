<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MakInvoices — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .icon-box {
      width: 72px;
      height: 72px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .icon-box svg { width: 36px; height: 36px; fill: #38bdf8; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #ffffff; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.5; max-width: 280px; margin-bottom: 28px; }
    .btn {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
      transition: transform 0.1s ease;
    }
    .btn:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="icon-box">
    <svg viewBox="0 0 24 24">
      <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L3.5 19.1a.996.996 0 1 0 1.41 1.41l1.52-1.52C8.03 20.24 9.95 21 12 21c4.97 0 9-4.03 9-9 0-2.12-.74-4.07-1.97-5.61l1.47-1.47a.996.996 0 1 0-1.41-1.41l-1.52 1.52C15.97 3.76 14.05 3 12 3zm0 16c-3.86 0-7-3.14-7-7 0-1.65.57-3.17 1.53-4.38l9.85 9.85C15.17 18.43 13.65 19 12 19zm5.47-2.62L7.62 6.53C8.83 5.57 10.35 5 12 5c3.86 0 7 3.14 7 7 0 1.65-.57 3.17-1.53 4.38z"/>
    </svg>
  </div>
  <h1>No Internet Connection</h1>
  <p>MakInvoices requires an active internet connection to load live billing and transaction data.</p>
  <button class="btn" onclick="retryConnection()">Retry Connection</button>

  <script>
    function retryConnection() {
      if (navigator.onLine) {
        window.location.href = 'https://makinvoices.com';
      } else {
        alert('Still offline. Please check your Wi-Fi or mobile data.');
      }
    }
    window.addEventListener('online', function() {
      window.location.href = 'https://makinvoices.com';
    });
  </script>
</body>
</html>
